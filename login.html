<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — BestGames</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Шапка (можно скопировать с главной, чтобы было единообразие) -->
    <header class="header">
        <div class="header__container">
            <a href="index.html" class="header__logo logo">
                <img src="img/logo.png" alt="Логотип BestGames" class="logo__img">
                <span class="logo__text">BestGames</span>
            </a>
            <nav class="header__nav nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
                    <li class="nav__item"><a href="catalog.html" class="nav__link">Каталог игр</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Основной контент (Форма входа) -->
    <main class="main auth-page">
        <div class="auth-container">
            <h1 class="auth-title">Вход в личный кабинет</h1>
            
            <form class="auth-form" id="loginForm">
                <!-- Поле Email -->
                <div class="auth-form__group">
                    <label for="login-email" class="auth-form__label">Email</label>
                    <input type="email" id="login-email" class="auth-form__input" placeholder="Введите ваш email" required>
                </div>

                <!-- Поле Пароль -->
                <div class="auth-form__group">
                    <label for="login-password" class="auth-form__label">Пароль</label>
                    <input type="password" id="login-password" class="auth-form__input" placeholder="Введите пароль" required>
                </div>

                <!-- Кнопка Войти -->
                <button type="submit" class="auth-form__btn">Войти</button>
                

                <!-- Ссылки под формой -->
                <div class="auth-form__links">
                    <a href="#" class="auth-form__link">Забыли пароль?</a>
                    <a href="register.html" class="auth-form__link">Регистрация</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Подключаем скрипты (пока можно без них) -->
    <script src="js/main.js"></script>
</body>
</html>
